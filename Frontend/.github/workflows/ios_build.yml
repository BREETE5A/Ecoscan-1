name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Add iOS platform
        working-directory: Frontend
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Restore GoogleService-Info.plist
        working-directory: Frontend/ios/Runner
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > GoogleService-Info.plist

      - name: Install CocoaPods
        working-directory: Frontend/ios
        run: pod install --repo-update

      - name: Build iOS (sans signature)
        working-directory: Frontend
        run: flutter build ios --release --no-codesign

      - name: Créer IPA
        working-directory: Frontend
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r EcoScan.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoScan-iOS
          path: Frontend/EcoScan.ipa
          retention-days: 7
