name: ecoscan
description: "EcoScan - Application mobile de tri des déchets recyclables"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  connectivity_plus: ^6.1.3
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
